name: Native platforms

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python test/setup_zig.py
      - run: zig build test --summary all
      - run: zig build install --summary all
      - if: runner.os != 'Windows'
        run: python test/interactive.py zig-out/bin/habush
      - if: runner.os == 'macOS'
        run: zig build test-sandbox --summary all
      - if: runner.os == 'Linux'
        run: zig build check -Dtarget=x86_64-freebsd --summary all
