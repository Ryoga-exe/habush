name: Native platforms

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.17.1'
      - run: zig build test --summary all
      - if: runner.os == 'macOS'
        run: zig build test-sandbox --summary all

  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: vmactions/freebsd-vm@v1
        with:
          release: '14.4'
          copyback: false
          # shortcut: use the official archive until FreeBSD packages Zig 0.17.1.
          prepare: |
            set -eu
            fetch -o /tmp/zig.tar.xz https://ziglang.org/download/0.17.1/zig-x86_64-freebsd-0.17.1.tar.xz
            mkdir -p /opt/zig
            tar -xf /tmp/zig.tar.xz -C /opt/zig --strip-components 1
          run: |
            set -eu
            export PATH="/opt/zig:$PATH"
            test "$(zig version)" = 0.17.1
            zig build test -j2 --summary all
