name: Native platforms

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.17.1'
      # TODO: Remove the macOS-only quarantine with a Zig release containing:
      # https://codeberg.org/ziglang/zig/pulls/36010
      - run: zig build test -Dskip-zig-36010=${{ runner.os == 'macOS' }} --test-timeout 60s --summary all
      - if: runner.os == 'macOS'
        run: zig build test-sandbox --summary all
      - name: Test optional Wasm host and CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64) wasm_arch=x86_64 ;;
            ARM64) wasm_arch=aarch64 ;;
            *) exit 1 ;;
          esac
          case "$RUNNER_OS" in
            Linux) wasm_os=linux ;;
            macOS) wasm_os=macos ;;
            *) exit 1 ;;
          esac
          wasm_sdk="wasmtime-v50.0.1-${wasm_arch}-${wasm_os}-c-api"
          curl --fail --location --silent --show-error \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.1/${wasm_sdk}.tar.xz" \
            -o "$RUNNER_TEMP/wasmtime.tar.xz"
          tar -xf "$RUNNER_TEMP/wasmtime.tar.xz" -C "$RUNNER_TEMP"
          zig build test -Dwasmtime="$RUNNER_TEMP/$wasm_sdk" -Dskip-zig-36010=${{ runner.os == 'macOS' }} --test-timeout 60s --summary all

  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: vmactions/freebsd-vm@v1
        with:
          release: '14.4'
          copyback: false
          # shortcut: use the official archive until FreeBSD packages Zig 0.17.1.
          prepare: |
            set -eu
            fetch -o /tmp/zig.tar.xz https://ziglang.org/download/0.17.1/zig-x86_64-freebsd-0.17.1.tar.xz
            mkdir -p /opt/zig
            tar -xf /tmp/zig.tar.xz -C /opt/zig --strip-components 1
          run: |
            set -eu
            export PATH="/opt/zig:$PATH"
            test "$(zig version)" = 0.17.1
            zig build test -j2 --test-timeout 60s --summary all
